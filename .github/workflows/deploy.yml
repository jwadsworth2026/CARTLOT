name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]   # change this if your default branch has a different name

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version into index.html
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          DATE_UTC=$(date -u +"%Y-%m-%d %H:%M UTC")
          STAMP="build ${{ github.run_number }} · ${SHA_SHORT} · ${DATE_UTC}"
          sed -i "s#__BUILD_STAMP__#${STAMP}#" index.html

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
